# Restart more slowly: when something else holds Mercury, every 30 s is
# plenty (it was every 10 s -- 3,600 restarts in one night).
#   sudo install -D -m 644 systemd/mercury-connector.service.d/restart.conf \
#        /etc/systemd/system/mercury-connector.service.d/restart.conf
#   sudo systemctl daemon-reload
[Service]
RestartSec=30
